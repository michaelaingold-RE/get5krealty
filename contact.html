<form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="space-y-4">
  <!-- Honeypot spam protection (hidden from users) -->
  <p class="hidden">
    <label>Don’t fill this out: <input name="bot-field" /></label>
  </p>

  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
    <input type="text" name="name" required
           class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-navy">
  </div>
  
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
    <input type="tel" name="phone"
           class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-navy">
  </div>
  
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
    <input type="email" name="email"
           class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-navy">
  </div>
  
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Property Address (if applicable)</label>
    <input type="text" name="address"
           class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-navy">
  </div>
  
  <div>
    <label class="block text-sm font-medium text-gray-700 mb-1">Message</label>
    <textarea name="message" rows="4"
              class="w-full border border-gray-300 rounded px-4 py-2 focus:outline-none focus:border-navy"></textarea>
  </div>
  
  <button type="submit" 
          class="w-full bg-navy text-white py-3 rounded font-semibold hover:bg-opacity-90">
    Send Message
  </button>
</form>
